# Application
spring.application.name=Vijay-Feign-API
# Sets the application name for logging, monitoring and identification.

server.port=8081
# Runs the consumer application on port 8081.

server.shutdown=graceful
# Allows ongoing requests to complete before shutting down the application.

# External User Service
integration.user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8082}
# Defines the producer service URL. Uses an environment variable if provided; otherwise, uses localhost:8082.

# OpenFeign
spring.cloud.openfeign.circuitbreaker.enabled=true
# Enables circuit breaker support for Feign client calls.

spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:2000}
# Maximum time to wait for a connection to the producer (default: 2 seconds).

spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:5000}
# Maximum time to wait for the producer's response after connecting (default: 5 seconds).

spring.cloud.openfeign.client.config.default.loggerLevel=basic
# Logs the HTTP method, URL, response status and execution time for Feign calls.

spring.cloud.openfeign.httpclient.enabled=true
# Enables Apache HttpClient 5 as the HTTP client used by Feign.

spring.cloud.openfeign.httpclient.max-connections=${FEIGN_MAX_CONNECTIONS:200}
# Sets the maximum total HTTP connections available in the connection pool.

spring.cloud.openfeign.httpclient.max-connections-per-route=${FEIGN_MAX_CONNECTIONS_PER_ROUTE:50}
# Limits the maximum connections to one destination service.

spring.cloud.openfeign.micrometer.enabled=true
# Enables Micrometer metrics for Feign client calls.

# Circuit Breaker
resilience.user-service.failure-rate-threshold=50
# Opens the circuit when 50% or more calls fail within the configured sliding window.

resilience.user-service.sliding-window-size=20
# Examines the last 20 calls when calculating the failure rate.

resilience.user-service.minimum-number-of-calls=10
# Waits for at least 10 calls before calculating the failure rate.

resilience.user-service.wait-duration-in-open-state=20s
# Keeps the circuit open for 20 seconds before allowing test calls again.

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Exposes these monitoring endpoints over HTTP.

management.endpoint.health.show-details=always
# Shows detailed health information, including component status.

management.endpoint.health.probes.enabled=true
# Enables liveness and readiness health probes, useful in Kubernetes deployments.

management.health.circuitbreakers.enabled=true
# Includes circuit breaker health information in the Actuator health endpoint.

# Tracing
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# Samples 10% of requests for distributed tracing by default.

# Logging
logging.level.com.vijaystack.feign=INFO
# Displays INFO-level logs and above for your application package.

logging.level.com.vijaystack.feign.client.UserFeignClient=DEBUG
# Enables DEBUG-level logging for your UserFeignClient package/interface.